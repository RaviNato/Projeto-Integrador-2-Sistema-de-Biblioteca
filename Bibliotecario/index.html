<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Configurações -->
        
        <link rel="stylesheet" href="styles.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="utf-8">
    </head>
    <body>
        <!-- Dropdown de redirecionamento -->
        
        <select id="dropdown">
            <option value="../Bibliotecario/index.html">Biblioteca</option>
            <option value="../Toten/index.html">Totem</option>
            <option value="../Aluno/index.html">Aluno</option>
        </select>
        
        
        <!-- Barra lateral -->
        
        <div class="sidebar">
            <button class="active" id="btnLivros">Livros</button>
            <button id="btnAlunos">Alunos</button>
            <button id="btnNaoDevolvidos">Livros não devolvidos</button>
            <button id="btnRegistros">Registro do Toten</button>
        </div>
        <main>
            <!-- Barra de pesquisa -->
            
            <div class="search-bar">
                <input type="text" placeholder="Buscar..." id="campoPesquisa" />
                <button id="addButton">Adicionar</button>
            </div>
            
            
            <!-- Tabela -->
            
            <table>
                <thead id="tableHeader">
                    <!-- Conteúdo será preenchido por JavaScript -->
                    <tr>
                        <th>Nome</th>
                        <th>Autor(a)</th>
                        <th>Categoria</th>
                        <th>Cód.</th>
                        <th>Qtd.</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Conteúdo será preenchido por JavaScript -->
                </tbody>
            </table>
        </main>
    
    
    
        <!-- Forms para adicionar livro -->]
        <form>
            <div id="modalOverlay" class="modal-overlay">
                <div class="modal-content">
                    <div class="form-row">
                        <label for="bookName">Nome:</label>
                        <input type="text" id="bookName" required />
                    </div>
                
                    <div class="form-row">
                        <label for="bookAuthor">Autor(a):</label>
                        <input type="text" id="bookAuthor" required />
                    </div>
                    
                    <div class="form-row">
                        <label for="bookYear">Ano de pub.:</label>
                        <input type="number" id="bookYear" required />
                    </div>
                    
                    <div class="form-row">
                        <label for="bookCategory">Categoria:</label>
                        <select id="bookCategory" required>
                            <option value=""></option>
                            <option value="Romance">Romance</option>
                            <option value="Fantasia">Fantasia</option>
                            <option value="Suspense">Suspense</option>
                            <option value="História">História</option>
                        </select>
                    </div>
                    
                    <div class="form-row">
                        <label for="bookQuantity">Qtd a add.:</label>
                        <input type="number" id="bookQuantity" required />
                    </div>
        
            
                    <div class="modal-buttons">
                        <button id="cancelModal">Cancelar</button>
                        <button type="submit" id="confirmAdd">Adicionar</button>
                    </div>
                </div>
            </div>
        </form>

        <script src="script.js"></script>
    </body>
</html>
